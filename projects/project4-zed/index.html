<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repertoire Organizer - Songs & Monologues</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Lato:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1>🎭 Repertoire Organizer</h1>
            <p class="subtitle">Organize your songs and monologues</p>
        </header>

        <!-- Main Content Area -->
        <main class="content-grid">
            <!-- Sidebar: Folder Navigation -->
            <aside class="sidebar">
                <div class="sidebar-header">
                    <h2>Folders</h2>
                    <button class="btn btn-primary" id="add-folder-btn" title="Add new folder">+ Folder</button>
                </div>
                <div id="folder-list" class="folder-list">
                    <!-- Folders will be dynamically inserted here -->
                </div>
            </aside>

            <!-- Main Panel: Items Display -->
            <section class="main-panel">
                <div class="panel-header">
                    <div class="breadcrumb">
                        <span id="current-folder-name">All Items</span>
                        <span id="current-category" class="category-badge"></span>
                    </div>
                    <div class="controls">
                        <button class="btn btn-secondary" id="add-item-btn">+ Add Item</button>
                    </div>
                </div>

                <!-- Filter by Category -->
                <div class="category-filter">
                    <button class="filter-btn active" data-category="all">All</button>
                    <button class="filter-btn" data-category="songs">Songs</button>
                    <button class="filter-btn" data-category="monologues">Monologues</button>
                </div>

                <!-- Items Grid -->
                <div id="items-container" class="items-grid">
                    <!-- Items will be dynamically inserted here -->
                </div>

                <!-- Empty State -->
                <div id="empty-state" class="empty-state">
                    <p>No items yet. Click "+ Add Item" to get started!</p>
                </div>
            </section>
        </main>
    </div>

    <!-- Modal: Add/Edit Folder -->
    <div id="folder-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="folder-modal-title">Add Folder</h2>
                <button class="close-btn" id="close-folder-modal">&times;</button>
            </div>
            <form id="folder-form">
                <div class="form-group">
                    <label for="folder-name">Folder Name</label>
                    <input type="text" id="folder-name" name="folder-name" placeholder="e.g., Audition Material" required>
                </div>
                <div class="form-group">
                    <label for="folder-color">Color</label>
                    <div class="color-picker">
                        <input type="radio" name="folder-color" value="#3b82f6" id="color-blue" checked>
                        <label for="color-blue" class="color-option" style="background-color: #3b82f6;"></label>
                        
                        <input type="radio" name="folder-color" value="#ef4444" id="color-red">
                        <label for="color-red" class="color-option" style="background-color: #ef4444;"></label>
                        
                        <input type="radio" name="folder-color" value="#10b981" id="color-green">
                        <label for="color-green" class="color-option" style="background-color: #10b981;"></label>
                        
                        <input type="radio" name="folder-color" value="#f59e0b" id="color-orange">
                        <label for="color-orange" class="color-option" style="background-color: #f59e0b;"></label>
                        
                        <input type="radio" name="folder-color" value="#8b5cf6" id="color-purple">
                        <label for="color-purple" class="color-option" style="background-color: #8b5cf6;"></label>
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" id="cancel-folder-btn">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Folder</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: Add/Edit Item -->
    <div id="item-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="item-modal-title">Add Item</h2>
                <button class="close-btn" id="close-item-modal">&times;</button>
            </div>
            <form id="item-form">
                <div class="form-group">
                    <label for="item-title">Title</label>
                    <input type="text" id="item-title" name="item-title" placeholder="e.g., Defying Gravity" required>
                </div>

                <div class="form-group">
                    <label for="item-type">Type</label>
                    <select id="item-type" name="item-type" required>
                        <option value="songs">Song</option>
                        <option value="monologues">Monologue</option>
                    </select>
                </div>

                <div class="form-group" id="artist-group">
                    <label for="item-artist">Artist/Composer</label>
                    <input type="text" id="item-artist" name="item-artist" placeholder="e.g., Stephen Schwartz">
                </div>

                <div class="form-group" id="show-group">
                    <label for="item-show">Show/Source</label>
                    <input type="text" id="item-show" name="item-show" placeholder="e.g., Wicked">
                </div>

                <div class="form-group">
                    <label for="item-folder">Folder</label>
                    <select id="item-folder" name="item-folder" required>
                        <option value="">Select a folder</option>
                        <!-- Folders will be populated dynamically -->
                    </select>
                </div>

                <div class="form-group">
                    <label for="item-notes">Notes (Optional)</label>
                    <textarea id="item-notes" name="item-notes" rows="3" placeholder="Add any notes about this piece..."></textarea>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" id="cancel-item-btn">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Item</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
